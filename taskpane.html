<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail Agent</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=5">
</head>
<body>
  <header>
    <img src="assets/icon-32.png" alt="" width="20" height="20">
    <span class="brand">Mail Agent</span>
    <button id="btnSettings" class="icon" title="Instellingen" aria-label="Instellingen">⚙</button>
  </header>

  <section id="settings" hidden>
    <h2>Instellingen</h2>
    <label for="inKey">Sleutel</label>
    <input id="inKey" type="password" autocomplete="off" placeholder="Plak hier de sleutel">
    <div class="row">
      <button id="btnSaveKey" class="primary">Bewaren en testen</button>
      <button id="btnCloseSettings">Sluiten</button>
    </div>
    <p id="settingsMsg" class="msg"></p>
  </section>

  <main id="main">
    <div id="loading" class="loading">Mail wordt bekeken…</div>

    <!-- 1. Wat is er aan de hand (analyse van MAILBOX, geen nieuwe AI-kost) -->
    <section id="secAnalyse" hidden>
      <div id="analyse" class="card"></div>
    </section>

    <!-- 2. Wie (klant + project op één regel) -->
    <section id="secSender" hidden>
      <div id="who" class="who">
        <div class="who-txt"><b id="whoName"></b><span id="whoProject" class="sub"></span></div>
        <button id="btnWho" class="link">wijzig</button>
      </div>
      <div id="senderMore" hidden>
        <div id="clientCard" class="card"></div>
        <div id="secProject">
          <label for="selProject">Project</label>
          <select id="selProject"></select>
          <p id="projectWhy" class="muted small"></p>
          <details id="ctxDetails">
            <summary>Offertes en werkbonnen</summary>
            <div id="ctx" class="list small"></div>
          </details>
        </div>
      </div>
      <div id="unknown" hidden>
        <p class="muted" id="unknownText"></p>
        <button id="btnExtract" class="primary wide">＋ Nieuwe klant uit handtekening</button>
        <label for="inSearchClient">Of koppel aan een bestaande klant</label>
        <input id="inSearchClient" type="search" placeholder="Zoek klant of project…">
        <div id="searchResults" class="list"></div>
      </div>
    </section>

    <!-- Nieuwe klant -->
    <section id="secNewClient" hidden>
      <h2>Nieuwe klant</h2>
      <div id="dupWarn" class="warn" hidden></div>
      <div class="grid">
        <label>Naam<input data-k="naam"></label>
        <label>Contactpersoon<input data-k="contactpersoon"></label>
        <label class="full">Straat + nr<input data-k="straat"></label>
        <label>Postcode<input data-k="postcode"></label>
        <label>Gemeente<input data-k="gemeente"></label>
        <label>Telefoon<input data-k="telefoon"></label>
        <label>Gsm<input data-k="gsm"></label>
        <label class="full">E-mail<input data-k="email"></label>
        <label>Btw<input data-k="btw"></label>
        <label>Land<input data-k="land" maxlength="2"></label>
        <label class="full">Website<input data-k="website"></label>
      </div>
      <div class="row">
        <button id="btnCreateClient" class="primary">✓ Maak klant in Robaws</button>
        <button id="btnCancelClient">Annuleer</button>
      </div>
    </section>

    <!-- 3. Wat doe je (drie knoppen; formulier enkel na een klik) -->
    <section id="secActions" hidden>
      <div class="acts" role="tablist">
        <button class="act" data-pane="paneReply" role="tab" title="Gewoon antwoorden: Apps → Antwoord met Robaws">✎ Bijsturen</button>
        <button class="act" data-pane="paneOffer" role="tab">€ Offerte</button>
        <button class="act" data-pane="tabTask" role="tab">✓ Taak</button>
        <button class="act" data-pane="tabAttach" role="tab" title="Mail en bijlagen aan het project hangen">📎</button>
      </div>

      <div id="paneReply" class="pane" hidden>
        <p class="small">Gewoon antwoorden? Gebruik <b>Apps → Antwoord met Robaws</b>. Hier stuur je het concept bij.</p>
        <button id="btnInstr" class="link">+ richting geven</button>
        <input id="inInstr" placeholder="bv. stel donderdag voor als nieuwe datum" hidden>
        <button id="btnReply" class="primary wide">Concept maken met Robaws-gegevens</button>
        <div id="replyBox" hidden>
          <div id="replyText" class="preview"></div>
          <div class="row">
            <button id="btnOpenReply" class="primary">Openen als antwoord</button>
            <button id="btnCopy">Kopiëren</button>
          </div>
          <details id="dFeiten"><summary id="sFeiten">Uit Robaws gebruikt</summary><ul id="lFeiten" class="small"></ul></details>
          <details id="dNakijk" open><summary id="sNakijk">Zelf nakijken</summary><ul id="lNakijk" class="small"></ul></details>
        </div>
      </div>

      <div id="paneOffer" class="pane" hidden>
        <button id="btnOffVoorstel" class="primary wide">Offertevoorstel maken uit deze mail</button>
        <div id="offBox" hidden>
          <div id="offKlant" class="card small"></div>
          <div class="grid">
            <label class="full">Titel<input id="offTitel"></label>
            <label class="full">Sjabloon<select id="offSjabloon"></select></label>
          </div>
          <div id="offRegels"></div>
          <div id="offOParams"></div>
          <p id="offRaming" class="raming"></p>
          <details id="dTwijfel" open><summary id="sTwijfel">Na te vragen</summary><ul id="lTwijfel" class="small"></ul></details>
          <button id="btnOffMaken" class="primary wide">✓ Maak conceptofferte in Robaws</button>
        </div>
      </div>

      <div id="tabTask" class="pane" hidden>
        <label for="inTitle">Titel</label>
        <input id="inTitle">
        <div class="grid">
          <label>Deadline<input id="inDeadline" type="date"></label>
        </div>
        <button id="btnNote" class="link">+ extra uitleg</button>
        <textarea id="inTaskNote" rows="2" hidden></textarea>
        <button id="btnTask" class="primary wide">✓ Maak taak in Robaws</button>
      </div>

      <div id="tabAttach" class="pane" hidden>
        <div id="attList" class="list"></div>
        <label for="inAttNote">Notitie (optioneel)</label>
        <textarea id="inAttNote" rows="2"></textarea>
        <button id="btnAttach" class="primary wide">✓ Hang aan project</button>
      </div>
    </section>

    <p id="status" class="msg" role="status"></p>
  </main>

  <script src="taskpane.js?v=9"></script>
</body>
</html>
