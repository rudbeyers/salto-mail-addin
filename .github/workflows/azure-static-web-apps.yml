# Publiceert de add-in naar Azure Static Web Apps (addin.salto-works.be).
# Doet niets zolang het geheim AZURE_STATIC_WEB_APPS_API_TOKEN niet in de repo staat.
name: Publiceren naar Azure
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SWA_TOKEN != ''
      - uses: Azure/static-web-apps-deploy@v1
        if: env.SWA_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"
          skip_app_build: true
